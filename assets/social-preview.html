<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Social Preview · 1280×640</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  body {
    font-family: "SF Pro Display", "SF Pro Text", -apple-system,
                 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #000;
    color: #f5f5f7;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1280px; height: 640px;
    overflow: hidden;
  }

  /* 唯一的光：极淡，只给背景一点层次 */
  .glow {
    position: absolute;
    right: -220px; top: -260px;
    width: 900px; height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(138,154,255,.16) 0%, rgba(138,154,255,0) 66%);
  }

  /* 安全区：x 100–1180，y 90–550 */
  .safe {
    position: absolute;
    left: 100px; top: 90px;
    width: 1080px; height: 460px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: #42a288;
    margin-bottom: 26px;
  }

  h1 {
    font-size: 108px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.012em;
    margin-bottom: 26px;
  }
  h1 .en {
    display: block;
    letter-spacing: -0.042em;
  }
  h1 .zh {
    letter-spacing: -0.025em;
  }

  .sub {
    font-size: 21px;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(245,245,247,.58);
    margin-bottom: 36px;
  }

  .rule {
    width: 150px;
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(90deg, #8a9aff, #a2daff);
    margin-bottom: 26px;
  }

  .cmd {
    display: inline-block;
    align-self: flex-start;
    font-family: "SF Mono", ui-monospace, Consolas, monospace;
    font-size: 14px;
    color: rgba(126,224,176,.9);
    background: rgba(66,162,136,.07);
    border: 1px solid rgba(66,162,136,.20);
    border-radius: 9px;
    padding: 10px 16px;
    margin-bottom: 12px;
  }

  .url {
    font-size: 13px;
    color: rgba(245,245,247,.30);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>

  <div class="safe">
    <div class="eyebrow">AGENT SKILL</div>
    <h1><span class="en">Apple</span><span class="zh">设计语言</span></h1>
    <p class="sub">版式、字体、色彩、文案，一套可以照着做的规范。</p>
    <div class="rule"></div>
    <div class="cmd">./install/install.sh --target claude</div>
    <div class="url">github.com/MokoKing666/apple-marketing-design</div>
  </div>
</div>
</body>
</html>
